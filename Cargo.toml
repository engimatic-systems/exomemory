[workspace]
members = ["."]
exclude = ["tests/probes/codex", "tests/probes/zvec"]
resolver = "3"

[package]
name = "exomemory"
version = "0.1.0"
edition = "2024"

[dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
